<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/SB.svg" />
    <title>Bootstrap Portfolio.</title>
  </head>

  <body class="d-flex flex-column">
    <div
      id="splash"
      class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center"
    >
      <img src="./assets/SB.svg" alt="" height="96" />
      <p class="fs-4 mt-3">Starter en ny tanke...</p>
      <div class="boot-line mt-3 mb-4" aria-hidden="true"></div>
      <button
        type="button"
        id="splash-skip"
        class="btn btn-sm glass rounded-pill px-4 text-body"
      >
        Gå direkte til skrivebordet
      </button>
    </div>
    <header
      class="navbar bg-white bg-opacity-50 px-4 position-relative z-3 small py-0"
    >
      <span class="navbar-brand fw-bold d-flex align-items-center gap-2 py-0">
        <span class="text-sb fst-italic fw-bold pe-1">SB</span>
        Stephanie Bekker
      </span>
    </header>

    <main class="container-fluid flex-grow-1 position-relative overflow-hidden">
      <div class="wall-shape" aria-hidden="true"></div>
      <div class="desktop-label position-absolute z-1 pe-none">
        <p>MULTIMEDIEDESIGNER &amp; WEBUDVIKLER</p>
        <h1>Velkommen<br />til mit<br /><em>skrivebord.</em></h1>
        <small> Der er næsten styr på det.↖</small>
      </div>
      <aside class="desktop-note position-absolute d-none d-md-block">
        Husk:<br />En anden vinkel kan også være en vej frem.
      </aside>
      <nav
        class="folders d-flex flex-wrap gap-3 gap-md-4 p-3 p-md-4 position-relative z-1"
        aria-label="Mapper"
      >
        <button
          type="button"
          data-window="om-mig"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >☆</span
          >
          Om mig
        </button>

        <button
          type="button"
          data-window="laes-mig"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >ⓘ</span
          >
          Læs mig
        </button>

        <button
          type="button"
          data-window="projekter"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >✎</span
          >
          Projekter
        </button>
      </nav>
      <section
        id="window"
        hidden
        class="desk-window card position-absolute shadow rounded-3"
      >
        <header
          class="card-header d-flex justify-content-between align-items-center"
        >
          <h2 id="window-title" class="fs-6 mb-0">Featured</h2>
          <button
            type="button"
            class="btn-close"
            aria-label="Luk vindue"
            id="window-close"
          ></button>
        </header>
        <div id="window-content" class="card-body"></div>
      </section>
      <template id="om-mig">
        <p>Om mig kommer her.</p>
      </template>
      <template id="laes-mig">
        <p>Læs mig kommer her.</p>
      </template>
      <template id="projekter">
        <p>Projekter kommer her.</p>
      </template>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
