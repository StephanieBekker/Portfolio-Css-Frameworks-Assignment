<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/SB.svg" />
    <title>Bootstrap Portfolio.</title>
  </head>

  <body class="d-flex flex-column">
    <div
      id="splash"
      class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center"
    >
      <img src="./assets/SB.svg" alt="" height="96" />
      <p class="fs-4 mt-3">Starter en ny tanke...</p>
      <div class="boot-line mt-3 mb-4" aria-hidden="true"></div>
      <button
        type="button"
        id="splash-skip"
        class="btn btn-sm glass rounded-pill px-4 text-body"
      >
        Gå direkte til skrivebordet
      </button>
    </div>
    <header
      class="navbar bg-white bg-opacity-50 px-4 position-relative z-3 small py-0"
    >
      <span class="navbar-brand fw-bold d-flex align-items-center gap-2 py-0">
        <span class="text-sb fst-italic fw-bold pe-1">SB</span>
        Stephanie Bekker
      </span>
    </header>

    <main class="container-fluid flex-grow-1 position-relative overflow-hidden">
      <div class="wall-shape" aria-hidden="true"></div>
      <div class="desktop-label position-absolute z-1 pe-none">
        <p>MULTIMEDIEDESIGNER &amp; WEBUDVIKLER</p>
        <h1>Velkommen<br />til mit<br /><em>skrivebord.</em></h1>
        <small> Der er næsten styr på det.↖</small>
      </div>
      <aside class="desktop-note position-absolute d-none d-md-block">
        Husk:<br />En anden vinkel kan også være en vej frem.
      </aside>
      <nav
        class="folders d-flex flex-wrap gap-3 gap-md-4 p-3 p-md-4 position-relative z-1"
        aria-label="Mapper"
      >
        <button
          type="button"
          data-window="about"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >☆</span
          >
          Om mig
        </button>

        <button
          type="button"
          data-window="readme"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >ⓘ</span
          >
          Læs mig
        </button>

        <button
          type="button"
          data-window="projects"
          class="btn btn-sm folder d-flex flex-column align-items-center gap-2 pt-3"
        >
          <span
            class="folder-shape d-flex justify-content-center align-items-center fs-4"
            aria-hidden="true"
            >✎</span
          >
          Projekter
        </button>
      </nav>
      <section
        id="window"
        role="dialog"
        aria-labelledby="window-title"
        hidden
        class="desk-window card position-absolute shadow rounded-3"
      >
        <header
          class="card-header d-flex justify-content-between align-items-center"
        >
          <h2 id="window-title" class="fs-6 mb-0">Featured</h2>
          <button
            type="button"
            class="btn-close"
            aria-label="Luk vindue"
            id="window-close"
          ></button>
        </header>
        <div id="window-content" class="card-body"></div>
      </section>
      <template id="about">
        <article class="about-me p-2">
          <div class="row g-4 align-items-center">
            <div class="col-12 col-md-4">
              <div class="about-photo position-relative">
                <span
                  class="about-orbit position-absolute"
                  aria-hidden="true"
                ></span>
                <img
                  src="./assets/stephanie-portrait.png"
                  alt="Stephanie Bekker portræt"
                  class="img-fluid d-block"
                />
                <span class="about-photo-label position-absolute px-3 py-2">
                  Hej, jeg er Stephanie
                </span>
              </div>
            </div>
            <div class="col-12 col-md-8">
              <p class="small">
                Multimediedesigner &amp; webudviklingsstuderende
              </p>
              <h3 class="fw-bold mb-0">Jeg har ikke<br /><em>én stil.</em></h3>
            </div>
          </div>
          <div class="about-text mt-4">
            <p>
              Jeg går meget op i webtilgængelighed. Alle skal have mulighed for
              at bruge digitale løsninger på lige fod. Jeg har set sider, hvor
              designet eller funktionerne gør det unødigt besværligt. Det vil
              jeg gerne være med til at ændre.
            </p>
            <p>
              Jeg kan lide at udfordre den oplagte løsning. Når noget virker
              kompliceret, bliver jeg nysgerrig på, om der findes en enklere vej
              til det samme resultat. Jeg ser efter mønstre og sammenhænge, der
              kan gøre digitale løsninger mere intuitive.
            </p>
          </div>
          <div class="about-interests mt-4">
            <p class="small fw-semibold mb-2">Det interesserer mig</p>
            <ul
              class="list-unstyled d-flex flex-wrap gap-2 mb-4"
              aria-label="Faglige interesser"
            >
              <li
                class="badge rounded-pill text-dark border fw-normal px-3 py-2"
              >
                Frontend
              </li>
              <li
                class="badge rounded-pill text-dark border fw-normal px-3 py-2"
              >
                Backend
              </li>
              <li
                class="badge rounded-pill text-dark border fw-normal px-3 py-2"
              >
                Databaser
              </li>
              <li
                class="badge rounded-pill text-dark border fw-normal px-3 py-2"
              >
                UX &amp; design
              </li>
            </ul>
          </div>
          <footer
            class="about-contact d-flex flex-wrap align-items-center justify-content-between gap-3 border-top pt-3 mt-4"
          >
            <span class="small">Vil du vide mere?</span>
            <a
              href="mailto:stephanieduvaldbekker@gmail.com"
              class="btn btn-dark rounded-pill px-3 py-2"
              >Skriv til mig<span aria-hidden="true"></span
            ></a>
          </footer>
        </article>
      </template>
      <template id="readme">
        <article class="readme p-2">
          <h3 class="fs-5 mb-3">Sådan bruger du skrivebordet</h3>
          <p>
            Gå på opdagelse i mapperne for at læse om mig og se mine projekter.
          </p>
          <ul class="mb-0">
            <li class="mb-2">Klik på en mappe for at åbne indholdet.</li>
            <li class="mb-2">
              Luk vinduet ved at klikke på krydset eller <kbd>Escape</kbd>
            </li>
            <li>
              Brug <kbd>Tab</kbd> til at navigere mellem knapperne og
              <kbd>Enter</kbd> til at åbne en mappe.
            </li>
          </ul>
        </article>
      </template>
      <template id="projects">
        <p>Projekter kommer her.</p>
      </template>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
