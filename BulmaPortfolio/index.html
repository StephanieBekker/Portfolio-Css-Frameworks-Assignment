<!doctype html>
<html lang="da" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/SB.svg" />
    <title>Bulma Portfolio.</title>
  </head>

  <body class="is-flex is-flex-direction-column">
    <div
      id="splash"
      class="is-flex is-flex-direction-column is-justify-content-center is-align-items-center"
    >
      <img src="./assets/SB.svg" alt="" width="83" height="96" />
      <p class="is-size-4 mt-4">Starter en ny tanke...</p>
      <div class="boot-line mt-4 mb-5" aria-hidden="true"></div>
      <button
        type="button"
        id="splash-skip"
        class="button glass is-rounded is-size-small has-text-weight-normal px-5 py-1"
      >
        Gå direkte til skrivebordet
      </button>
    </div>
    <header class="navbar px-3">
      <div class="navbar-brand">
        <span class="navbar-item is-gap-1">
          <span class="text-sb is-italic has-text-weight-bold pr-1">SB</span>
          Stephanie Bekker
        </span>
      </div>
    </header>

    <main class="px-3 is-relative is-flex-grow-1 is-clipped">
      <div class="wall-shape" aria-hidden="true"></div>
      <div class="desktop-label">
        <p>MULTIMEDIEDESIGNER &amp; WEBUDVIKLER</p>
        <h1>Velkommen<br />til mit<br /><em>skrivebord.</em></h1>
        <small> Der er næsten styr på det.↖</small>
      </div>
      <aside class="desktop-note is-hidden-mobile">
        Husk:<br />En anden vinkel kan også være en vej frem.
      </aside>
      <nav
        class="folders is-relative is-flex is-flex-wrap-wrap p-4"
        aria-label="Mapper"
      >
        <button
          type="button"
          data-window="about"
          class="folder is-size-small is-flex is-flex-direction-column is-align-items-center is-gap-1 pt-4 px-2 pb-1"
        >
          <span
            class="folder-shape is-flex is-justify-content-center is-align-items-center is-size-4"
            aria-hidden="true"
            >☆</span
          >
          Om mig
        </button>

        <button
          type="button"
          data-window="readme"
          class="folder is-size-small is-flex is-flex-direction-column is-align-items-center is-gap-1 pt-4 px-2 pb-1"
        >
          <span
            class="folder-shape is-flex is-justify-content-center is-align-items-center is-size-4"
            aria-hidden="true"
            >ⓘ</span
          >
          Læs mig
        </button>

        <button
          type="button"
          data-window="projects"
          class="folder is-size-small is-flex is-flex-direction-column is-align-items-center is-gap-1 pt-4 px-2 pb-1"
        >
          <span
            class="folder-shape is-flex is-justify-content-center is-align-items-center is-size-4"
            aria-hidden="true"
            >✎</span
          >
          Projekter
        </button>
      </nav>
      <section
        id="window"
        role="dialog"
        aria-labelledby="window-title"
        hidden
        class="desk-window card"
      >
        <header class="card-header">
          <h2 id="window-title" class="is-size-6 mb-0">Featured</h2>
          <button
            type="button"
            class="delete"
            aria-label="Luk vindue"
            id="window-close"
          ></button>
        </header>
        <div id="window-content" class="card-content"></div>
      </section>
      <template id="about">
        <article class="about-me p-2">
          <div class="columns is-multiline is-vcentered">
            <div class="column is-4-tablet">
              <div class="about-photo is-relative">
                <span class="about-orbit" aria-hidden="true"></span>
                <img
                  src="./assets/stephanie-portrait.png"
                  alt="Stephanie Bekker portræt"
                  class="is-block"
                />
                <span class="about-photo-label px-4 py-2">
                  Hej, jeg er Stephanie
                </span>
              </div>
            </div>
            <div class="column is-8-tablet">
              <p class="is-size-small">
                Multimediedesigner &amp; webudviklingsstuderende
              </p>
              <h3 class="has-text-weight-bold mb-0">
                Jeg har ikke<br /><em>én stil.</em>
              </h3>
            </div>
          </div>
          <div class="about-text mt-5">
            <p>
              Jeg går meget op i webtilgængelighed. Alle skal have mulighed for
              at bruge digitale løsninger på lige fod. Jeg har set sider, hvor
              designet eller funktionerne gør det unødigt besværligt. Det vil
              jeg gerne være med til at ændre.
            </p>
            <p>
              Jeg kan lide at udfordre den oplagte løsning. Når noget virker
              kompliceret, bliver jeg nysgerrig på, om der findes en enklere vej
              til det samme resultat. Jeg ser efter mønstre og sammenhænge, der
              kan gøre digitale løsninger mere intuitive.
            </p>
          </div>
          <div class="about-interests mt-5">
            <p class="is-size-small has-text-weight-semibold mb-2">
              Det interesserer mig
            </p>
            <ul class="tags mb-5" aria-label="Faglige interesser">
              <li class="tag is-rounded has-border px-4">Frontend</li>
              <li class="tag is-rounded has-border px-4">Backend</li>
              <li class="tag is-rounded has-border px-4">Databaser</li>
              <li class="tag is-rounded has-border px-4">UX &amp; design</li>
            </ul>
          </div>
          <footer
            class="about-contact is-inline-flex is-flex-direction-column is-align-items-flex-start is-gap-1 p-5 mt-5"
          >
            <span class="about-contact-title is-italic is-size-5"
              >Vil du vide mere?</span
            >
            <a
              href="mailto:stephanieduvaldbekker@gmail.com"
              class="button is-rounded has-text-weight-normal px-4 py-2"
            >
              Skriv til mig
            </a>
          </footer>
        </article>
      </template>
      <template id="readme">
        <article class="readme p-2">
          <h3 class="readme-note is-inline-block px-4 py-4 mb-5">
            Sådan bruger du skrivebordet
          </h3>
          <p>
            Gå på opdagelse i mapperne for at læse om mig og se mine projekter.
          </p>
          <ul class="mb-0">
            <li class="is-flex is-gap-2 p-4 is-rounded-3 mb-2">
              <span
                class="readme-icon is-inline-flex is-align-items-center is-justify-content-center is-flex-shrink-0 is-rounded-circle"
                aria-hidden="true"
                >↖</span
              >
              <p class="mb-0">
                <strong class="is-block">Åbn en mappe</strong>
                Klik på en mappe for at åbne indholdet.
              </p>
            </li>
            <li class="is-flex is-gap-2 p-4 is-rounded-3 mb-2">
              <span
                class="readme-icon is-inline-flex is-align-items-center is-justify-content-center is-flex-shrink-0 is-rounded-circle"
                aria-hidden="true"
                >×</span
              >
              <p class="mb-0">
                <strong class="is-block">Luk vinduet</strong>
                Klik på krydset eller tryk på <kbd>Escape</kbd>.
              </p>
            </li>
            <li class="is-flex is-gap-2 p-4 is-rounded-3">
              <span
                class="readme-icon is-inline-flex is-align-items-center is-justify-content-center is-flex-shrink-0 is-rounded-circle"
                aria-hidden="true"
                >⌨</span
              >
              <p class="mb-0">
                <strong class="is-block">Brug tastaturet</strong>
                Brug <kbd>Tab</kbd> til at navigere mellem knapperne og
                <kbd>Enter</kbd> til at åbne en mappe.
              </p>
            </li>
          </ul>
        </article>
      </template>
      <template id="projects">
        <article class="p-2">
          <header class="mb-5">
            <h3 class="readme-note is-inline-block px-4 py-4 mb-0">
              Mine projekter
            </h3>
            <svg
              class="projects-intro-line"
              viewBox="0 0 235 10"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M3 5 C55 1 125 9 232 4" />
            </svg>
          </header>
          <article class="project-card card is-rounded-3 p-5">
            <div class="columns is-multiline is-vcentered">
              <div class="column is-4-tablet">
                <div class="project-art is-relative" aria-hidden="true">
                  <span class="project-orbit"></span>
                  <img src="./assets/lakal/item.png" alt="" class="is-block" />
                  <span class="project-art-note px-4 py-2"> Lån tæt på </span>
                </div>
              </div>
              <div class="project-card-text column is-8-tablet">
                <p class="project-eyebrow mb-2">
                  EKSAMENSPROJEKT · 1. SEMESTER
                </p>
                <h4 class="mb-2">LÅKAL</h4>
                <p class="is-size-small mb-4">Webudvikling · Gruppeprojekt</p>
                <p class="project-description">
                  En låneapp for naboer i samme boligfællesskab. Del de ting, I
                  allerede har, frem for at købe nyt.
                </p>
                <ul
                  class="project-tags tags mb-5"
                  aria-label="Fagområder i projektet"
                >
                  <li class="tag is-rounded has-border px-4">Frontend</li>
                  <li class="tag is-rounded has-border px-4">Backend</li>
                  <li class="tag is-rounded has-border px-4">Databaser</li>
                  <li class="tag is-rounded has-border px-4">UX</li>
                </ul>
                <button
                  type="button"
                  data-window="lakal"
                  data-title="LÅKAL"
                  class="project-open button is-rounded has-text-weight-normal px-4 py-2"
                >
                  Læs om LÅKAL
                  <span aria-hidden="true">↗</span>
                </button>
              </div>
            </div>
          </article>
        </article>
      </template>
      <template id="lakal">
        <article class="project-details p-2">
          <nav
            class="is-flex is-justify-content-space-between is-align-items-center is-gap-2 mb-5"
            aria-label="projektnavigation"
          >
            <button
              type="button"
              data-window="projects"
              data-title="✎ Projekter"
              class="project-back button is-text has-text-weight-normal p-0 is-size-small"
            >
              <span aria-hidden="true">↩</span> Tilbage til projekter
            </button>
            <span class="tag is-rounded has-border has-background-white"
              >Gruppeprojekt
            </span>
          </nav>
          <header class="columns is-multiline is-vcentered mb-5">
            <div class="column is-8-tablet">
              <p class="project-eyebrow mb-2">1. SEMESTER · WEBUDVIKLING</p>
              <h3 class="project-title" tabindex="-1">LÅKAL</h3>
              <p class="project-summary">
                Lån og del i<br /><em>dit boligfællesskab.</em>
              </p>
              <ul
                class="project-tags tags mb-0"
                aria-label="Fagområder i projektet"
              >
                <li class="tag is-rounded has-border px-4">Frontend</li>
                <li class="tag is-rounded has-border px-4">Backend</li>
                <li class="tag is-rounded has-border px-4">Databaser</li>
                <li class="tag is-rounded has-border px-4">UX</li>
              </ul>
            </div>
            <div class="column is-4-tablet is-hidden-mobile">
              <div class="project-art is-relative" aria-hidden="true">
                <span class="project-orbit"></span>
                <img src="./assets/lakal/item.png" alt="" class="is-block" />
                <span class="project-art-note px-4 py-2"> Lån tæt på </span>
              </div>
            </div>
          </header>
          <div class="columns is-multiline has-border-y py-5">
            <section
              class="column is-5-tablet"
              aria-labelledby="lakal-about-title"
            >
              <h4
                id="lakal-about-title"
                class="is-size-6 has-text-weight-bold mb-2"
              >
                Om projektet
              </h4>
              <p class="is-size-small mb-0">
                LÅKAL er et gruppeprojekt udviklet som eksamensprojekt på første
                semester af webudvikling.
              </p>
            </section>
            <section
              class="column is-7-tablet"
              aria-labelledby="lakal-task-title"
            >
              <div class="project-task is-rounded-3 p-4 is-full-height">
                <h4
                  id="lakal-task-title"
                  class="is-size-6 has-text-weight-bold mb-2"
                >
                  Opgaven
                </h4>
                <p class="is-size-small mb-0">
                  Undersøg og find et udækket behov med fokus på bæredygtighed.
                  Udvikl en løsning som en Single Page Application (SPA) i Vue
                  3.
                </p>
              </div>
            </section>
          </div>
          <div class="columns is-multiline is-2 my-4">
            <div class="column is-6-tablet">
              <section
                class="project-answer has-border is-rounded-3 p-4 is-full-height"
                aria-labelledby="lakal-problem-title"
              >
                <p class="project-eyebrow mb-2">01 / PROBLEMET</p>
                <h4 id="lakal-problem-title">Lån frem for at købe</h4>
                <p class="is-size-small mb-0">
                  Hvordan gør vi det enkelt og trygt for naboer at låne
                  genstande af hinanden frem for at købe nyt?
                </p>
              </section>
            </div>
            <div class="column is-6-tablet">
              <section
                class="project-answer project-solution has-border is-rounded-3 p-4 is-full-height"
                aria-labelledby="lakal-solution-title"
              >
                <p class="project-eyebrow mb-2">02 / VORES LØSNING</p>
                <h4 id="lakal-solution-title">Et fælles sted at dele</h4>
                <p class="is-size-small mb-0">
                  En app for naboer i samme boligfællesskab, fx et kollegium
                  eller en boligblok. Her kan man oprette ting til udlån og
                  anmode om at låne andres.
                </p>
              </section>
            </div>
          </div>
          <section
            class="project-process mt-5"
            aria-labelledby="lakal-process-title"
          >
            <h4
              id="lakal-process-title"
              class="readme-note is-inline-block px-4 py-4 mb-5"
            >
              Fra idé til løsning
            </h4>
            <div class="columns is-multiline">
              <!--- Personaen Mathilde -->
              <div class="column is-4-tablet">
                <figure class="columns is-mobile is-multiline mb-0">
                  <div class="column is-4-mobile is-12-tablet">
                    <button
                      type="button"
                      class="process-image-button is-full-width has-border is-rounded-3 p-4"
                      data-image="Persona Mathilde"
                      aria-label="Vis personaen"
                    >
                      <img
                        src="./assets/lakal/persona.png"
                        alt="Personaen Mathilde med mål, behov og frustrationer"
                      />
                    </button>
                  </div>
                  <figcaption class="column is-8-mobile is-12-tablet">
                    <p class="project-eyebrow mb-2">01 / BRUGEROPLEVELSE</p>
                    <h5>Forstå behovet</h5>
                    <p class="is-size-small mb-0">
                      Research og personaer satte retningen for en enkel og
                      lokal låneoplevelse.
                    </p>
                  </figcaption>
                </figure>
              </div>
              <!-- Databasens ER-diagram -->
              <div class="column is-4-tablet">
                <figure class="columns is-mobile is-multiline mb-0">
                  <div class="column is-4-mobile is-12-tablet">
                    <button
                      type="button"
                      class="process-image-button process-database is-full-width has-border is-rounded-3 p-4"
                      data-image="Databasens ER-diagram"
                      aria-label="Vis ER-diagrammet større"
                    >
                      <img
                        src="./assets/lakal/database.png"
                        alt="ER-diagrammet over relationer mellem bruger,genstande og lån"
                      />
                    </button>
                  </div>
                  <figcaption class="column is-8-mobile is-12-tablet">
                    <p class="project-eyebrow mb-2">02 / DATABASE</p>
                    <h5>Skab sammenhæng</h5>
                    <p class="is-size-small mb-0">
                      En relationel MySQL-database binder brugere, genstande og
                      lån sammen.
                    </p>
                  </figcaption>
                </figure>
              </div>
              <!-- De to trin i Opret genstand-->
              <div class="column is-4-tablet">
                <figure class="columns is-mobile is-multiline mb-0">
                  <div class="column is-4-mobile is-12-tablet">
                    <div
                      class="process-screen-pair is-flex is-gap-1 has-border is-rounded-3 p-4"
                    >
                      <button
                        type="button"
                        class="process-step p-0"
                        data-image="Opret genstand: trin 1"
                        aria-label="Vis første trin større"
                      >
                        <img
                          src="./assets/lakal/create-step-1.png"
                          alt="Første trin: billede, kategori og navn på genstanden"
                        />
                      </button>
                      <button
                        type="button"
                        class="process-step p-0"
                        data-image="Opret genstand: trin 2"
                        aria-label="Vis andet trin større"
                      >
                        <img
                          src="./assets/lakal/create-step-2.png"
                          alt="Andet trin: tilbehør, stand og låneperiode"
                        />
                      </button>
                    </div>
                  </div>
                  <figcaption class="column is-8-mobile is-12-tablet">
                    <p class="project-eyebrow mb-2">03 / DEN UDVIKLEDE APP</p>
                    <h5>Gør det brugbart</h5>
                    <p class="is-size-small mb-0">
                      Frontend og backend understøtter oprettelse af genstande
                      og låneanmodninger.
                    </p>
                  </figcaption>
                </figure>
              </div>
            </div>
            <p class="is-size-small mt-4 mb-0">
              Klik på billederne for at se dem større.
            </p>
          </section>
          <section
            class="project-learning p-5 my-5"
            aria-labelledby="lakal-learning-title"
          >
            <h4 id="lakal-learning-title">Det tager jeg med</h4>
            <p class="is-size-small">
              Vi havde større ambitioner end tiden tillod. Derfor prioriterede
              vi kernefunktionerne.
            </p>
            <ul class="columns is-multiline mb-0">
              <li class="column is-4-tablet">
                <strong class="is-block">Prioritering</strong>
                Funktionalitet før visuel finpudsning.
              </li>
              <li class="column is-4-tablet">
                <strong class="is-block">Struktur</strong>
                Overblik over opgaver og fælles kode
              </li>
              <li class="column is-4-tablet">
                <strong class="is-block">Afgrænsning</strong>
                Tilpasse ambitionerne til tiden.
              </li>
            </ul>
          </section>
          <footer class="has-border-top pt-4 mt-5">
            <p class="is-size-small has-text-weight-semibold mb-2">
              Teknologier og metoder
            </p>
            <ul
              class="project-tags tags mb-4"
              aria-label="Teknologier og metoder"
            >
              <li class="tag is-rounded has-border px-4">Vue 3</li>
              <li class="tag is-rounded has-border px-4">Node.js</li>
              <li class="tag is-rounded has-border px-4">Express</li>
              <li class="tag is-rounded has-border px-4">MySQL</li>
              <li class="tag is-rounded has-border px-4">REST API</li>
              <li class="tag is-rounded has-border px-4">CRUD</li>
            </ul>
            <a
              href="https://github.com/StephanieBekker/semester-project-naborrow"
              target="_blank"
              rel="noopener noreferrer"
              class="project-open button is-rounded has-text-weight-normal px-4 py-2"
            >
              Se koden på GitHub
              <span class="is-sr-only">(åbner i en ny fane)</span>
            </a>
          </footer>
        </article>
      </template>
      <dialog
        id="image-preview"
        class="image-preview"
        aria-labelledby="image-preview-title"
      >
        <header
          class="image-preview-header is-flex is-flex-wrap-wrap is-align-items-center is-gap-2 p-4"
        >
          <h3 id="image-preview-title" class="is-size-6 mb-0"></h3>
          <div class="is-flex is-align-items-center is-gap-2 ml-auto">
            <div
              class="is-flex is-align-items-center is-gap-1"
              role="group"
              aria-label="Billedzoom"
            >
              <button
                type="button"
                id="image-zoom-out"
                class="button zoom-button is-rounded-circle"
                aria-label="Zoom ud"
                disabled
              >
                −
              </button>

              <output
                id="image-zoom-level"
                class="is-size-small has-text-centered"
                aria-live="polite"
              >
                100%
              </output>

              <button
                type="button"
                id="image-zoom-in"
                class="button zoom-button is-rounded-circle"
                aria-label="Zoom ind"
              >
                +
              </button>
            </div>

            <button
              type="button"
              id="image-preview-close"
              class="delete"
              aria-label="Luk billede"
              autofocus
            ></button>
          </div>
        </header>
        <div
          class="image-preview-body p-4"
          tabindex="0"
          aria-label="Billedområde"
        >
          <img id="image-preview-img" alt="" />
        </div>
      </dialog>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
